<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Prácticas de Enfermería</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" type="image/jpeg" href="./assets/branding/uninorte-logo.jpg">
  <link rel="apple-touch-icon" href="./assets/branding/uninorte-logo.jpg">
  <script src="./js/theme.js"></script>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div class="login-page">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <main class="login-wrap">
      <form class="login-card" id="login" novalidate>
        <div class="login-head">
          <span class="login-plaque"><img src="./assets/branding/uninorte-logo.jpg" width="104" height="104" alt="Logo de la Universidad del Norte, Enfermería"></span>
          <span class="login-uni">Universidad del Norte</span>
          <h1>Sistema de Prácticas de Enfermería</h1>
          <p>Accede con tu cuenta académica de demostración</p>
        </div>
        <div class="form-error" id="err" role="alert" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
          <span></span>
        </div>
        <div class="field">
          <label for="username">Usuario</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input class="input" id="username" name="username" placeholder="nombre.usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
          </div>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input class="input" id="password" name="password" type="password" placeholder="Tu contraseña" autocomplete="current-password" required>
          </div>
        </div>
        <button class="btn btn-lg btn-block" type="submit" id="submit">Iniciar sesión</button>
      </form>
      <p class="login-brandline">Proyecto académico v0.1 · Grupo 02</p>
    </main>
  </div>
  <script src="./js/demo-validation.js"></script>
  <script src="./js/demo-api.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
